name: Users Tracking
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== profiles columns ==="
          q "select column_name, data_type from information_schema.columns where table_name='profiles' order by ordinal_position;"
          echo "=== add last_seen ==="
          q "alter table public.profiles add column if not exists last_seen timestamptz;"
          q "create index if not exists profiles_last_seen_idx on public.profiles (last_seen desc);"
          echo "=== allow a user to stamp their own last_seen ==="
          q "drop policy if exists \\\"Profiles update own\\\" on public.profiles;"
          q "create policy \\\"Profiles update own\\\" on public.profiles for update using (auth.uid() = id) with check (auth.uid() = id);"
          echo "=== counts now ==="
          q "select count(*) as total_profiles from public.profiles;"
          q "select count(*) as auth_users from auth.users;"
          echo "=== verify ==="
          q "select column_name, is_nullable from information_schema.columns where table_name='profiles' and column_name='last_seen';"
