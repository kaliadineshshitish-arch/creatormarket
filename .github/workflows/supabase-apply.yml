name: Supabase Apply Auth Settings

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 scripts/apply-auth-settings.py
