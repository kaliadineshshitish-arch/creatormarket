name: DNS Check 5
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Q
        run: |
          for r in 8.8.8.8 1.1.1.1; do
            echo "--- via $r ---"
            echo -n "NS: "; dig +short creatormarketkit.in NS @$r | tr '\n' ' '; echo
            echo -n "A:  "; dig +short creatormarketkit.in A @$r | tr '\n' ' '; echo
          done
          echo "=== HTTP ==="
          curl -s -o /dev/null -w "http: %{http_code}\n" -m 25 -L "http://creatormarketkit.in" || echo ERR
          curl -s -o /dev/null -w "https: %{http_code}\n" -m 25 -L "https://creatormarketkit.in" || echo ERR
