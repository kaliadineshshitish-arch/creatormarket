name: Profiles Public Read
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== profiles policies before ==="
          q "select policyname, cmd, qual from pg_policies where schemaname='public' and tablename='profiles';"
          echo "=== add public read ==="
          q "drop policy if exists \\\"Profiles public read\\\" on public.profiles;"
          q "create policy \\\"Profiles public read\\\" on public.profiles for select using (true);"
          echo "=== after ==="
          q "select policyname, cmd from pg_policies where schemaname='public' and tablename='profiles';"
