name: Order Check
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== orders columns ==="
          q "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='orders' order by ordinal_position;"
          echo "=== recent orders ==="
          q "select id, amount, status, notified_at, created_at from public.orders order by created_at desc limit 5;"
