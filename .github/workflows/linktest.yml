name: Link Test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        run: |
          for u in \
            "https://creatormarket-nu.vercel.app/" \
            "https://creatormarket-nu.vercel.app/resume-builder" \
            "https://creatormarket-nu.vercel.app/resume-builder.html" \
            "https://creatormarket-nu.vercel.app/blog" \
            "https://creatormarket-nu.vercel.app/blog/" \
            "https://creatormarket-nu.vercel.app/blog/resume-kaise-banayein" \
            "https://creatormarket-nu.vercel.app/blog/how-to-sell-digital-products-in-india" \
            "https://creatormarket-nu.vercel.app/pricing" \
            "https://creatormarket-nu.vercel.app/privacy-policy" \
            "https://creatormarket-nu.vercel.app/terms" \
            "https://creatormarket-nu.vercel.app/refund-policy" \
            "https://creatormarket-nu.vercel.app/contact" \
            "https://creatormarket-nu.vercel.app/ai-prompt-generator" \
            "https://creatormarket-nu.vercel.app/hashtag-generator" \
            "https://creatormarket-nu.vercel.app/why-creator-market" \
            "https://creatormarket-nu.vercel.app/sell-digital-products" \
            "https://creatormarket-nu.vercel.app/llms.txt" \
            "https://creatormarket-nu.vercel.app/sitemap.xml" \
            "https://creatormarket-nu.vercel.app/robots.txt" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 25 -L "$u")
            echo "$code  $u"
          done
