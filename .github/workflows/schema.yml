name: Schema Check

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Query
        run: |
          q() {
            curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"query\": \"$1\"}"
            echo
          }
          echo "=== profiles columns ==="
          q "select column_name, data_type, is_nullable, column_default from information_schema.columns where table_schema='public' and table_name='profiles' order by ordinal_position;"
          echo "=== existing triggers on auth.users ==="
          q "select tgname from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='auth' and c.relname='users' and not t.tgisinternal;"
          echo "=== profiles policies ==="
          q "select policyname, cmd from pg_policies where schemaname='public' and tablename='profiles';"
