name: Order Check
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== latest orders ==="
          q "select id, kind, product_id, amount, currency, status, payment_id, created_at from public.orders order by created_at desc limit 5;"
          echo "=== products (for the id) ==="
          q "select id, title, price, file_path, is_published from public.products order by created_at desc limit 5;"
