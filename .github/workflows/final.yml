name: Final Check
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== products ==="
          q "select left(title,32) as title, category, price, case when image_url is null then 'NO IMG' else 'img' end as img, case when file_path is null then 'NO FILE' when file_path like '%.png' then 'PNG!' else 'ok' end as fil from public.products order by created_at;"
          echo "=== count ==="
          q "select count(*)::int as products from public.products;"
          echo "=== payout details saved? ==="
          q "select id, full_name, role from public.profiles;"
          q "select column_name from information_schema.columns where table_schema='public' and table_name='creator_payouts' order by ordinal_position;"
          q "select * from public.creator_payouts;"
