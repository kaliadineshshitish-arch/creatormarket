name: Reviews Fix
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== existing constraints ==="
          q "select conname, pg_get_constraintdef(oid) as def from pg_constraint where conrelid='public.reviews'::regclass;"
          echo "=== make buyer_id optional + add reviewer_name ==="
          q "alter table public.reviews alter column buyer_id drop not null;"
          q "alter table public.reviews add column if not exists reviewer_name text;"
          echo "=== allow anyone to insert a review ==="
          q "drop policy if exists \\\"Reviews insert\\\" on public.reviews;"
          q "create policy \\\"Reviews insert\\\" on public.reviews for insert with check (true);"
          echo "=== one review per buyer per product (only when logged in) ==="
          q "create unique index if not exists reviews_product_buyer_uniq on public.reviews (product_id, buyer_id) where buyer_id is not null;"
          echo "=== verify ==="
          q "select column_name, is_nullable from information_schema.columns where table_name='reviews' order by ordinal_position;"
          q "select policyname, cmd, with_check from pg_policies where tablename='reviews';"
