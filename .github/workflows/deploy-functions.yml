name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: eqwmsjsqrhgyfpyssfop
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          set -e
          for fn in create-order verify-payment ai-tools analyze thumbnail owner-report confirm-payment confirm-payment-link; do
            echo "Deploying $fn ..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
          echo "All functions deployed."

      - name: Set function secrets
        shell: bash
        run: |
          set -e
          declare -A S=(
            [CASHFREE_APP_ID]="${{ secrets.CASHFREE_APP_ID }}"
            [CASHFREE_SECRET_KEY]="${{ secrets.CASHFREE_SECRET_KEY }}"
            [SARVAM_API_KEY]="${{ secrets.SARVAM_API_KEY }}"
            [YOUTUBE_API_KEY]="${{ secrets.YOUTUBE_API_KEY }}"
            [OWNER_EMAIL]="${{ secrets.OWNER_EMAIL }}"
          )
          ARGS=("CASHFREE_ENV=production")
          for k in "${!S[@]}"; do
            if [ -n "${S[$k]}" ]; then ARGS+=("$k=${S[$k]}"); fi
          done
          echo "Setting ${#ARGS[@]} secret(s) in Supabase (live mode) ..."
          supabase secrets set "${ARGS[@]}" --project-ref "$PROJECT_REF"
          echo "Secrets set."
