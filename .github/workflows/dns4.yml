name: DNS Check 4
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Q
        run: |
          for d in creatormarket.in creatormarketkit.in creatormarket.co.in; do
            echo "=== $d ==="
            echo -n "NS: "; dig +short $d NS @8.8.8.8 | tr '\n' ' '; echo
            echo -n "A:  "; dig +short $d A @8.8.8.8 | tr '\n' ' '; echo
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -L "http://$d" || echo ERR)
            echo "HTTP: $code"
          done
