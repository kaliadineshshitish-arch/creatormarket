name: Profiles Trigger

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Apply
        run: |
          cat > sql.sql <<'SQL'
          create or replace function public.handle_new_user()
          returns trigger
          language plpgsql
          security definer
          set search_path = public
          as $$
          begin
            insert into public.profiles (id, full_name)
            values (
              new.id,
              coalesce(
                nullif(new.raw_user_meta_data->>'full_name',''),
                nullif(new.raw_user_meta_data->>'name',''),
                split_part(new.email,'@',1)
              )
            )
            on conflict (id) do nothing;
            return new;
          end;
          $$;

          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created
            after insert on auth.users
            for each row execute function public.handle_new_user();

          insert into public.profiles (id, full_name)
          select u.id,
                 coalesce(
                   nullif(u.raw_user_meta_data->>'full_name',''),
                   nullif(u.raw_user_meta_data->>'name',''),
                   split_part(u.email,'@',1)
                 )
          from auth.users u
          on conflict (id) do nothing;
          SQL
          jq -n --arg q "$(cat sql.sql)" '{query: $q}' > body.json
          echo "=== apply result ==="
          curl -s -m 60 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @body.json
          echo
          echo "=== verify: trigger exists ==="
          jq -n --arg q "select tgname from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='auth' and c.relname='users' and not t.tgisinternal;" '{query: $q}' > v1.json
          curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @v1.json
          echo
          echo "=== verify: profiles now ==="
          jq -n --arg q "select count(*)::int as profiles from public.profiles;" '{query: $q}' > v2.json
          curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @v2.json
          echo
