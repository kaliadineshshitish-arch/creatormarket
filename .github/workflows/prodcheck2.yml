name: Products Check 2
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== products columns ==="
          q "select column_name, data_type from information_schema.columns where table_schema='public' and table_name='products' order by ordinal_position;"
          echo "=== products data ==="
          q "select * from public.products order by created_at;"
          echo "=== storage objects ==="
          q "select bucket_id, name, created_at from storage.objects order by created_at desc limit 15;"
