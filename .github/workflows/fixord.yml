name: Fix Orders
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== add missing columns ==="
          q "alter table public.orders add column if not exists commission_amount numeric default 0;"
          q "alter table public.orders add column if not exists creator_payout numeric default 0;"
          echo "=== confirm order 2 (owner verified the UPI payment) ==="
          q "update public.orders set status='paid', commission_amount=0, creator_payout=amount, payment_id=coalesce(nullif(payment_id,''),'UPI confirmed by owner') where id=2 and status='pending';"
          echo "=== verify ==="
          q "select id, amount, status, commission_amount, creator_payout from public.orders order by id desc limit 3;"
