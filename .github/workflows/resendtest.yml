name: Resend Test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
      RESEND: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Test
        run: |
          echo "key present: $([ -n "$RESEND" ] && echo YES || echo NO)"
          echo "key prefix: ${RESEND:0:4}"
          echo "=== send test email via Resend ==="
          curl -s -m 40 -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND" \
            -H "Content-Type: application/json" \
            -d '{"from":"CreatorMarket <onboarding@resend.dev>","to":["kaliadineshshitish@gmail.com"],"subject":"CreatorMarket email test","html":"<p>If you can read this, Resend works.</p>"}'
          echo
          echo "=== orders in DB ==="
          curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select id, amount, status, notified_at from public.orders order by created_at desc limit 5;"}'
          echo
          echo "=== function secrets ==="
          curl -s -m 40 "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print([s.get('name') for s in d])"
