name: Tool Ratings Table
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== create table ==="
          q "create table if not exists public.tool_ratings (id bigint generated by default as identity primary key, tool text not null, rating int not null check (rating between 1 and 5), comment text, created_at timestamptz default now());"
          q "alter table public.tool_ratings enable row level security;"
          q "drop policy if exists \\\"tool_ratings insert\\\" on public.tool_ratings;"
          q "create policy \\\"tool_ratings insert\\\" on public.tool_ratings for insert with check (true);"
          q "drop policy if exists \\\"tool_ratings read\\\" on public.tool_ratings;"
          q "create policy \\\"tool_ratings read\\\" on public.tool_ratings for select using (true);"
          echo "=== verify ==="
          q "select column_name, data_type from information_schema.columns where table_name='tool_ratings';"
          q "select policyname, cmd from pg_policies where tablename='tool_ratings';"
