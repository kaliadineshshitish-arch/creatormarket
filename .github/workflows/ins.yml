name: Insert Test
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== defaults / nullable ==="
          q "select column_name, is_nullable, column_default from information_schema.columns where table_schema='public' and table_name='orders' order by ordinal_position;"
          echo "=== try an insert (no id) ==="
          q "insert into public.orders (buyer_id, kind, amount, status, payment_id) values ('c90765eb-fbc4-41b5-8b00-0cc70bf7041c','product',99,'pending','SQL test') returning id;"
          echo "=== rows now ==="
          q "select id, amount, status, notified_at from public.orders order by created_at desc limit 3;"
          echo "=== cleanup test row ==="
          q "delete from public.orders where payment_id='SQL test';"
