name: Fix Product Data
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Fix
        run: |
          cat > sql.sql <<'SQL'
          update public.products set category='AI Prompts' where title like 'AI Content Creator%';
          update public.products set category='AI Prompts' where title like '100 AI Viral Mahadev%';
          update public.products set category='AI Prompts' where title like 'Indian Small Business%';
          update public.products set category='AI Prompts' where title like 'AI Lead Generation%';
          update public.products set category='Finance'    where title like 'Ultimate Budget%';
          update public.products set category='Templates'  where title like 'Freelancer Client%';
          update public.products set category='eBooks'     where title like 'Dog Training%';
          update public.products set category='eBooks'     where title like 'Gym%';
          update public.products set category='eBooks'     where title like 'Resume and Interview%';
          update public.products set category='eBooks'     where title like 'Digital Product Launch%';

          update public.products
             set image_url='https://eqwmsjsqrhgyfpyssfop.supabase.co/storage/v1/object/public/product-images/c90765eb-fbc4-41b5-8b00-0cc70bf7041c/1793630896051-file_0000000021b88207a67f2cb5a119e79e.png'
           where title like 'Resume and Interview%' and image_url is null;

          update public.products
             set image_url='https://eqwmsjsqrhgyfpyssfop.supabase.co/storage/v1/object/public/product-images/c90765eb-fbc4-41b5-8b00-0cc70bf7041c/1793631214637-file_00000000f3e48207893abef019262662.png'
           where title like 'Digital Product Launch%' and image_url is null;

          update public.products
             set file_path='c90765eb-fbc4-41b5-8b00-0cc70bf7041c/1793630917426-Job-Ready-Resume-and-Interview-Kit-Hinglish.pdf'
           where title like 'Resume and Interview%' and file_path is null;

          update public.profiles set full_name='DK Digital Studio' where id='c90765eb-fbc4-41b5-8b00-0cc70bf7041c';
          SQL
          jq -n --arg q "$(cat sql.sql)" '{query: $q}' > body.json
          echo "=== applied ==="
          curl -s -m 60 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @body.json
          echo
          echo "=== verify ==="
          jq -n --arg q "select left(title,26) as title, category, case when image_url is null then 'NO IMAGE' else 'img ok' end as img, case when file_path is null then 'NO FILE' else 'file ok' end as fil from public.products order by created_at;" '{query: $q}' > v.json
          curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d @v.json
          echo
