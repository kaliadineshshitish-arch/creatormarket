name: Fix Creator Name
on:
  workflow_dispatch:
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: eqwmsjsqrhgyfpyssfop
    steps:
      - name: Q
        run: |
          q() { curl -s -m 40 -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{\"query\": \"$1\"}"; echo; }
          echo "=== profiles before ==="
          q "select id, full_name from public.profiles;"
          echo "=== set name for the empty ones ==="
          q "update public.profiles set full_name='DK Digital Studio' where full_name is null or full_name='' or full_name like '%@%';"
          echo "=== profiles after ==="
          q "select id, full_name from public.profiles;"
